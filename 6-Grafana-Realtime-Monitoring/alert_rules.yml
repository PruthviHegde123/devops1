groups:
  - name: delivery_alerts
    rules:
      - alert: HighPendingDeliveries
        expr: pending_deliveries > 20
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "High pending deliveries"
          description: "Pending deliveries have exceeded 20 for 10 seconds."

      - alert: HighAverageDeliveryTime
        expr: average_delivery_time_seconds > 30
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "High average delivery time"
          description: "Average delivery time has exceeded 30 seconds for 10 seconds."